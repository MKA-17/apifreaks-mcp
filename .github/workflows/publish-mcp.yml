name: Publish to MCP Registry

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish-mcp:
    name: Publish to MCP Registry
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Wait for npm version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "Waiting for @apifreaks/mcp@${VERSION} on npm"
          for i in $(seq 1 3); do
            if npm view "@apifreaks/mcp@${VERSION}" version >/dev/null 2>&1; then
              echo "Found @apifreaks/mcp@${VERSION}"
              exit 0
            else
              echo "Attempt ${i}/3: not on npm yet, sleeping 15s"
              sleep 15
            fi
          done
          echo "@apifreaks/mcp@${VERSION} was not found on npm"
          exit 1

      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          sudo mv mcp-publisher /usr/local/bin/

      - name: Sync server.json version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          jq --arg v "$VERSION" '.version = $v | .packages[0].version = $v' server.json > server.json.tmp
          mv server.json.tmp server.json

      - name: Publish to MCP Registry
        run: |
          mcp-publisher login github-oidc
          mcp-publisher publish
